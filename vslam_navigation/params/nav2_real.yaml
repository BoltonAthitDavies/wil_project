# Nav2 for the REAL Ackermann rig on a prior RTAB-Map map, localised by
# ORB-SLAM3 (odometry) + RTAB-Map localize mode (map -> orbslam3_world).
#
# Derived from aws-robomaker-small-warehouse-world/params/nav2_ackermann.yaml,
# whose header explains every curvature number below (rear-axle bound 1.6673 1/m,
# base_link minimum radius 0.6355 m, why min_lookahead_dist is 1.30, why
# rotate-to-heading must be off, why velocity_smoother must scale all
# components together). Read that header before changing any of them.
#
# WHAT DIFFERS FROM THE SIMULATION FILE
#   * odometry frame is orbslam3_world (what the ORB-SLAM3 node broadcasts), and
#     map -> orbslam3_world is RTAB-Map's live correction, NOT identity. So the
#     local costmap is a ROLLING window in the odometry frame, and the static
#     layer inside it is transformed through TF; behavior_server runs in the
#     odometry frame too.
#   * /map comes from RTAB-Map (use_saved_map in localize mode), latched; there
#     is no map_server unless the launch is given a map yaml for offline tests.
#   * NO live obstacle sensing. The rig has no lidar, and RTAB-Map's local grids
#     are off in localize mode (the dense stereo cost starved the front end).
#     Both costmaps therefore contain only the prior map. Anything that moved in
#     since the map was built is invisible to the planner. Re-enable
#     use_collision_detection and add an obstacle layer the day a live source
#     exists.
#   * speed is capped at 0.6 m/s for the first trials (project target 1.5 m/s).
#   * use_sim_time is REWRITTEN at launch (true on bag replay, false live).
#
# REAL CHASSIS (user measurements; wheel base CORRECTED 7 Nov 2026 from 0.46 to
# 0.60 m) and what follows from them:
#   wheel_base L = 0.60 m, steering limit d = 20 deg (0.349 rad)
#   footprint about base_link (on the floor under the IMU): +0.13 m forward,
#   -0.52 m back, +-0.21 m sideways -> circumscribed radius 0.56 m
#       rear axle   k = tan(d)/L = 0.607 1/m        (R = 1.649 m)
#       base_link   R = sqrt(1.649^2 + 0.60^2) = 1.754 m, taking base_link at the
#                   front axle (0.13 m of body ahead of it); planned at 1.85 m
#       RPP lookahead must satisfy 2/L_d <= 1/1.754 -> L_d >= 3.51 m: 3.55 here.
#       max yaw rate = 0.607 * 1.5 m/s = 0.91 rad/s.
#   This car turns in a 3.5 m circle, not the 2.7 m assumed before the
#   correction. In a 10 x 7 m zone that is most of the short dimension: give
#   goals that do not need a U-turn anywhere near a wall, and expect Smac to
#   reject more of them than it did.
#
#   UNRESOLVED, and it is the steering limit that is in doubt, not the wheel
#   base. The cross-check from dataset_realv7_001 (ORB trajectory against
#   /cmd_steering +-30) measured a turn rate of 0.19-0.26 rad/s at 0.29 m/s,
#   i.e. R ~1.4 m at the IMU. With L = 0.46 that implied an 18 deg wheel angle,
#   consistent with a 20 deg limit; with L = 0.60 the same measurement implies
#   23 deg, which EXCEEDS the stated limit. Either the limit is nearer 23 deg,
#   or the measured radius was optimistic (R = 1.6 m would give 20.6 deg).
#   Everything below therefore assumes 20 deg, which is the CONSERVATIVE choice:
#   it plans a wider circle than the car may actually need, and planning a
#   wider circle than the car can turn is safe while the converse is not.
#   Re-measure on a figure-of-eight at full lock before raising it.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /orbslam3/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_through_poses_bt_xml: REWRITTEN_AT_LAUNCH
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.50
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.30
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.50
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.50
      yaw_goal_tolerance: 3.15
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 1.5 m/s is the project target; the bridge's max_speed launch argument
      # (default 0.6) caps what reaches the robot during the first trials.
      desired_linear_vel: 1.50
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 1.00
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 2.00
      lookahead_dist: 3.55
      min_lookahead_dist: 3.55                 # >= 2 x 1.754 m (see header)
      max_lookahead_dist: 4.50
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.00
      regulated_linear_scaling_min_speed: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 3.15
      max_angular_accel: 1.00
      max_robot_pose_search_dist: 5.0
      # The real transform chain arrives through two nodes (ORB at frame rate,
      # RTAB-Map's correction at its detection rate); give it room.
      transform_tolerance: 0.30
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.00

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.30
      downsample_costmap: false
      # The prior map has unknown cells wherever stereo never saw: refusing to
      # plan through them is the safe default with no live sensor.
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 1.85          # base_link floor 1.754 m + margin
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: orbslam3_world
    robot_base_frame: base_link
    transform_tolerance: 0.30
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.91
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    # yaw 0.91 = 0.607 1/m x 1.5 m/s (wheel base 0.60 m, 7 Nov correction).
    # Accelerations chosen, not measured: 0.5 m/s^2
    # reaches 1.5 m/s in 3 s and keeps the front end's IMU excitation gentle;
    # -1.0 m/s^2 stops from 1.5 m/s in 1.5 s / 1.1 m, inside the 2.7 m lookahead
    # and the planner's inflation. Nothing here senses live obstacles, so braking
    # authority is the only margin against what the prior map does not show.
    max_velocity: [1.50, 0.0, 0.91]
    min_velocity: [-0.30, 0.0, -0.91]
    max_accel: [0.50, 0.0, 1.00]
    max_decel: [-1.00, 0.0, -1.50]
    odom_topic: /orbslam3/odometry
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""                   # set by the launch for offline tests only

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    # false: the pose gate (scripts/pose_gate.py) starts the stack once the
    # localisation is judged sound, and pauses it when it stops being sound.
    autostart: false
    bond_timeout: 20.0
    attempt_respawn_reconnection: true
    node_names:                         # overridden by the launch (map_server optional)
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: false
      width: 20
      height: 20
      origin_x: -10.0
      origin_y: -10.0
      resolution: 0.05
      footprint: "[[-0.52, 0.21], [0.13, 0.21], [0.13, -0.21], [-0.52, -0.21]]"
      footprint_padding: 0.05
      transform_tolerance: 0.30
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      # ---- live obstacle perception, on the GLOBAL costmap --------------
      # Removed on 15 Nov 2026 and restored the same day, which is worth
      # recording because both decisions were right at the time.
      #
      # Removed because the first run with live obstacles came back smeared
      # across the whole warehouse: a camera clears only along rays inside its
      # current field of view, so the global map marks freely and barely clears,
      # and every spurious return accumulates for the length of the run.
      #
      # Restored because without it NOTHING can route around a new obstacle.
      # SmacPlannerHybrid plans on THIS costmap; RegulatedPurePursuit is a path
      # follower and does not avoid anything, with or without a local costmap;
      # and use_collision_detection is off for its own measured reason. So the
      # box appeared in the local costmap and the path went straight through it.
      #
      # What changed between the two decisions: the smear was produced with
      # marking at 8 m and Grid/RangeMax 10. Both are now 4 m and 5 m, chosen
      # because stereo depth error grows with the square of range and
      # Experiment 3 measured this pipeline displacing walls by about 0.5 m.
      # If the smear returns at these ranges, the next lever is a
      # ClearEntireCostmap behaviour in the recovery branch rather than a wider
      # threshold.
      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        combination_method: 1
        observation_sources: rtabmap_cloud
        rtabmap_cloud:
          # RELATIVE topic on a node with no namespace, so it is /local_grid_
          # obstacle and NOT /rtabmap/local_grid_obstacle -- the same trap the
          # trajectory writer hit with /mapPath.
          topic: /local_grid_obstacle
          data_type: "PointCloud2"
          marking: true
          clearing: true
          # Grid/RangeMax is 10.0; stay inside it so the layer never marks at a
          # range the segmentation did not actually reach.
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.80
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: orbslam3_world
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[-0.52, 0.21], [0.13, 0.21], [0.13, -0.21], [-0.52, -0.21]]"
      footprint_padding: 0.05
      transform_tolerance: 0.30
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      # ---- live obstacle perception ------------------------------------
      # Added 15 Nov 2026. Before this both costmaps ran
      # ["static_layer", "inflation_layer"] and the stack had NO live
      # perception at all: everything it knew was the prior grid, a photograph
      # of the warehouse taken at mapping time. A walking person, a moved
      # pallet jack, a door closed since: invisible. In the one dynamic
      # Experiment 4 run the actors walked within 1.4 m of the spawn and
      # nothing reacted, because nothing could see them.
      #
      # The source is RTAB-Map's own per-frame obstacle cloud. It is produced
      # by the SAME segmentation that built the prior -- Grid/MaxGroundHeight
      # 0.29 matched to the chassis, MaxObstacleHeight 2.0, RayTracing, noise
      # filtering at 0.1 m / 5 neighbours -- so a live obstacle and a mapped
      # one are the same kind of thing, which a separately-tuned depth pipeline
      # would not guarantee. It is lazily published: nothing appeared on the
      # topic before because nothing subscribed.
      #
      # VoxelLayer, not ObstacleLayer: the cloud is 3-D and a camera needs 3-D
      # ray tracing to clear what it no longer sees. A person who walks on
      # would otherwise leave a trail of marks behind them.
      #
      # LIMIT, and it binds here: the cloud is published once per PROCESSED
      # frame, so it updates at Rtabmap/DetectionRate, 1 Hz by default. A person
      # at 1.4 m/s moves 1.4 m between updates. For dynamic-world runs raise
      # detection_rate, at a CPU cost on a laptop that already throttles.
      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        combination_method: 1
        observation_sources: rtabmap_cloud
        rtabmap_cloud:
          # RELATIVE topic on a node with no namespace, so it is /local_grid_
          # obstacle and NOT /rtabmap/local_grid_obstacle -- the same trap the
          # trajectory writer hit with /mapPath.
          topic: /local_grid_obstacle
          data_type: "PointCloud2"
          marking: true
          clearing: true
          # Grid/RangeMax is 10.0; stay inside it so the layer never marks at a
          # range the segmentation did not actually reach.
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.80
      always_send_full_costmap: true
